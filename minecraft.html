<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft HTML5</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }
        
        /* Startmeny */
        #menu-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1607988795691-3d0147b43231?q=80&w=1200') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .logo {
            font-size: 4rem;
            font-weight: bold;
            color: #5cbf3a;
            text-shadow: 4px 4px #2c6315, 6px 6px #000;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .menu-btn {
            width: 300px;
            padding: 15px;
            margin: 10px;
            background-color: #4a4a4a;
            border: 3px solid #000;
            color: #e0e0e0;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -4px -4px #2a2a2a, inset 4px 4px #7a7a7a;
        }
        .menu-btn:hover {
            background-color: #5cbf3a;
            color: #fff;
            box-shadow: inset -4px -4px #3c8225, inset 4px 4px #8cee5d;
        }
        
        /* Spelskärm */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* UI / Crosshair / Hotbar */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            mix-blend-mode: difference;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.6);
            padding: 6px;
            border: 3px solid #333;
            border-radius: 4px;
        }
        .hotbar-slot {
            width: 50px;
            height: 50px;
            margin: 0 4px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.1);
            position: relative;
            cursor: pointer;
        }
        .hotbar-slot.active {
            border-color: #fff;
            background-color: rgba(255,255,255,0.3);
        }
        .block-preview {
            width: 30px;
            height: 30px;
        }
        .block-preview.dirt { background-color: #866043; }
        .block-preview.grass { background-color: #5cbf3a; }
        .block-preview.stone { background-color: #808080; }
        .block-preview.wood { background-color: #a06e3b; }
        .block-preview.glass { background-color: rgba(173, 216, 230, 0.6); border: 1px dashed #fff; }
        
        /* Instruktioner */
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            line-height: 1.4;
            pointer-events: none;
        }
        #instructions h3 { margin-bottom: 5px; color: #5cbf3a; }
    </style>
    <!-- Three.js och PointerLockControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- MENY -->
    <div id="menu-container">
        <div class="logo">MINECRAFT HTML5</div>
        <button class="menu-btn" id="start-btn">SPELA NY VÄRLD</button>
        <button class="menu-btn" onclick="alert('Skapat i ren HTML/CSS/JS med Three.js!')">OM SPELET</button>
    </div>

    <!-- SPELSKÄRM -->
    <div id="game-container">
        <div id="instructions">
            <h3>KONTROLLER:</h3>
            W, A, S, D — Flytta runt<br>
            MUS — Titta dig omkring<br>
            VÄNSTERKLICK — Ta bort block<br>
            HÖGERKLICK — Placera block<br>
            1 - 5 — Välj blocktyp<br>
            ESC — Tillbaka till meny
        </div>
        <div id="crosshair"></div>
        <div id="hotbar">
            <div class="hotbar-slot active" data-block="1"><div class="block-preview grass"></div></div>
            <div class="hotbar-slot" data-block="2"><div class="block-preview dirt"></div></div>
            <div class="hotbar-slot" data-block="3"><div class="block-preview stone"></div></div>
            <div class="hotbar-slot" data-block="4"><div class="block-preview wood"></div></div>
            <div class="hotbar-slot" data-block="5"><div class="block-preview glass"></div></div>
        </div>
    </div>

    <script>
        // PointerLock Implementation i korthet för att sköta kameran
        class SimplePointerLock {
            constructor(element, onChange) {
                this.element = element;
                this.onChange = onChange;
                this.isLocked = false;
                document.addEventListener('pointerlockchange', () => {
                    this.isLocked = document.pointerLockElement === this.element;
                    this.onChange(this.isLocked);
                });
            }
            request() { this.element.requestPointerLock(); }
        }

        // Globala spelvariabler
        let scene, camera, renderer, pointerLock;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        let blocks = [];
        let activeBlockType = 1; // 1: Grass, 2: Dirt, 3: Stone, 4: Wood, 5: Glass
        
        // Blockmaterial / färger
        const materials = {
            1: new THREE.MeshLambertMaterial({ color: 0x5cbf3a }), // Grass
            2: new THREE.MeshLambertMaterial({ color: 0x866043 }), // Dirt
            3: new THREE.MeshLambertMaterial({ color: 0x808080 }), // Stone
            4: new THREE.MeshLambertMaterial({ color: 0xa06e3b }), // Wood
            5: new THREE.MeshLambertMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.6 }) // Glass
        };
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        const menuContainer = document.getElementById('menu-container');
        const gameContainer = document.getElementById('game-container');
        const startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', () => {
            menuContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            if(!scene) initGame();
            pointerLock.request();
        });

        function initGame() {
            // Skapa scen och kamera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee); // Himmelsblå
            scene.fog = new THREE.FogExp2(0x7ec0ee, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(16, 3, 16);

            // Belysning
            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(20, 40, 20);
            scene.add(directionalLight);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            gameContainer.appendChild(renderer.domElement);

            // Pointer lock hantering
            pointerLock = new SimplePointerLock(renderer.domElement, (locked) => {
                if (!locked) {
                    menuContainer.style.display = 'flex';
                    gameContainer.style.display = 'none';
                }
            });

            // Musrörelse för att titta runt
            let pitch = 0, yaw = 0;
            document.addEventListener('mousemove', (e) => {
                if (!pointerLock.isLocked) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
                
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            });

            // Generera en platt startvärld (32x32 block)
            for(let x = 0; x < 32; x++) {
                for(let z = 0; z < 32; z++) {
                    // Lager 0: Sten
                    createBlock(x, 0, z, 3);
                    // Lager 1: Jord
                    createBlock(x, 1, z, 2);
                    // Lager 2: Gräs
                    createBlock(x, 2, z, 1);
                }
            }

            // Keyboard lyssnare
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);

            // Anpassa vid skärmstorleksändring
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Starta loopen
            animate();
        }

        function createBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(geometry, materials[type]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push(mesh);
            mesh.blockType = type;
        }

        // Tangentbordskontroller
        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Digit1': selectHotbarSlot(1); break;
                case 'Digit2': selectHotbarSlot(2); break;
                case 'Digit3': selectHotbarSlot(3); break;
                case 'Digit4': selectHotbarSlot(4); break;
                case 'Digit5': selectHotbarSlot(5); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function selectHotbarSlot(index) {
            activeBlockType = index;
            document.querySelectorAll('.hotbar-slot').forEach((slot, idx) => {
                slot.classList.toggle('active', idx === index - 1);
            });
        }

        // Klicka på hotbar direkt
        document.querySelectorAll('.hotbar-slot').forEach((slot) => {
            slot.addEventListener('click', (e) => {
                selectHotbarSlot(parseInt(slot.getAttribute('data-block')));
            });
        });

        // Bygga och förstöra block via Raycasting
        function onMouseDown(e) {
            if (!pointerLock.isLocked) return;

            const raycaster = new THREE.Raycaster();
            // Centrum av skärmen
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];
                
                if (e.button === 0) { // Vänsterklick: Ta bort block
                    scene.remove(intersect.object);
                    blocks = blocks.filter(b => b !== intersect.object);
                } 
                else if (e.button === 2 || e.button === 1) { // Högerklick / Mittklick: Placera block
                    const normal = intersect.face.normal;
                    const newPos = intersect.object.position.clone().add(normal);
                    // Runda av positioner
                    createBlock(Math.round(newPos.x), Math.round(newPos.y), Math.round(newPos.z), activeBlockType);
                }
            }
        }

        // Förhindra högerklicksmeny i spelet
        document.addEventListener('contextmenu', e => {
            if(pointerLock && pointerLock.isLocked) e.preventDefault();
        });

        // Animationsloopen
        function animate() {
            requestAnimationFrame(animate);

            if (pointerLock && pointerLock.isLocked) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // Dämpa hastighet (friktion)
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                // Hämta kamerans riktning i xz-planet för förflyttning
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();
                
                const camRight = new THREE.Vector3(-camDir.z, 0, camDir.x);

                if (moveForward || moveBackward) {
                    velocity.addScaledVector(camDir, direction.z * 40.0 * delta);
                }
                if (moveLeft || moveRight) {
                    velocity.addScaledVector(camRight, direction.x * 40.0 * delta);
                }

                // Uppdatera kameraposition
                camera.position.addScaledVector(velocity, delta);
                
                // Enkel golvgräns så man inte faller för evigt
                if (camera.position.y < 3.5) {
                    velocity.y = 0;
                    camera.position.y = 3.5;
                }

                prevTime = time;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
